[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.package_name }}"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "pandas-stubs>=2.2.0.240218",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = ["{{ cookiecutter.package_name }}*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

# Private packages: CodeArtifact index `karius`. `aws@` in the URL is required
# for CodeArtifact basic auth + keyrings.codeartifact. User-level:
# `keyring-provider = "subprocess"` in ~/.config/uv/uv.toml, `uv tool install
# keyring --with keyrings.codeartifact`. See:
# https://docs.astral.sh/uv/guides/integration/aws/
[[tool.uv.index]]
name = "karius"
url = "https://aws@karius-573640641260.d.codeartifact.us-east-1.amazonaws.com/pypi/karius-pypi/simple/"
explicit = true

