name: Formatting checks

on:
  push:
  pull_request:

env:
  TERM: xterm

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck fish-common
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.12
          sudo mv actionlint /usr/local/bin/
          uv tool install ansible-lint

      - name: Check formatting
        run: make fmt_check

  macos-bootstrap:
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Ansible dependencies
        run: |
          brew install ansible shellcheck fish ansible-lint actionlint
          uv pip install --system ansible

      - name: Run dotfiles playbook (CI-safe tags)
        env:
          CI: true
        run: |
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          uv run ansible-playbook \
            -i ansible/inventory.ini \
            ansible/dotfiles.yml \
            --skip-tags never

      - name: Check formatting
        run: make fmt_check
