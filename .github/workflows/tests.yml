name: Formatting checks

on:
  push:
  pull_request:

env:
  TERM: xterm

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install mise and pinned tool versions
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck fish-common

      - name: Check formatting
        run: make fmt_check

  macos-bootstrap:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Ansible dependencies
        run: brew install ansible neovim tmux mise

      - name: Run dotfiles playbook
        env:
          CI: true
          # Fail on any top-level fact var (ansible_user_dir etc.) instead of
          # warning; the default flips in ansible-core 2.24.
          ANSIBLE_INJECT_FACT_VARS: "False"
        run: |
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          ansible-galaxy install -r ansible/requirements.yml
          ansible-playbook -i ansible/inventory.ini ansible/dotfiles.yml
