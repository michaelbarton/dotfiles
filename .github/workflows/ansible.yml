name: Ansible Playbook

on: [push]

env:
  TERM: xterm

jobs:
  playbook:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Symlink checkout to ~/.dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Neovim
        run: |
          curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf nvim-linux-x86_64.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install Galaxy requirements
        run: >
          uvx --from ansible-core ansible-galaxy
          install -r "$HOME/.dotfiles/ansible/requirements.yml"

      - name: Check playbook syntax
        run: >
          uvx --from ansible-core ansible-playbook
          -i "localhost,"
          -c local
          "$HOME/.dotfiles/ansible/dotfiles.yml"
          --syntax-check

      - name: Run playbook (skip macOS-only tasks)
        run: >
          uvx --from ansible-core ansible-playbook
          -i "localhost,"
          -c local
          "$HOME/.dotfiles/ansible/dotfiles.yml"
          --skip-tags never
