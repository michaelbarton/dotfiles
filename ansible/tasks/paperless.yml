---
- name: Create paperless data directories
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.paperless/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - data
    - media

- name: Create paperless consume directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/Documents/consume"
    state: directory
    mode: "0755"

# The paperless auto-start agent is host-specific: it must only run on this
# personal machine, never on a work computer that happens to check out these
# dotfiles. Gated on inventory group membership (ansible/inventory.ini)
# rather than a hardcoded hostname string, which had silently stopped
# matching after this machine was renamed — `ansible_hostname == "Michaels-
# MacBook-Air"` was false here, so this block had never actually installed
# the launch agent.
- name: Install paperless start launch agent
  when: ansible_fqdn in (groups['personal'] | default([]))
  block:
    - name: Copy paperless start launchd plist
      ansible.builtin.copy:
        src: "{{ dotfiles_dir }}/paperless-ngx/uk.me.michaelbarton.paperless-start.plist"
        dest: "{{ ansible_user_dir }}/Library/LaunchAgents/uk.me.michaelbarton.paperless-start.plist"
        mode: "0644"
      register: paperless_start_plist

    - name: Bootstrap paperless start launch agent
      ansible.builtin.command:
        cmd: launchctl bootstrap gui/{{ ansible_user_uid }} "{{ ansible_user_dir }}/Library/LaunchAgents/uk.me.michaelbarton.paperless-start.plist"
      when: paperless_start_plist.changed
      changed_when: true

- name: Check if paperless env file exists
  ansible.builtin.stat:
    path: "{{ dotfiles_dir }}/paperless-ngx/docker-compose.env"
  register: paperless_env_stat

- name: Generate paperless secret key
  ansible.builtin.command:
    cmd: python3 -c "import secrets; print(secrets.token_urlsafe(50))"
  register: paperless_secret_key
  when: not paperless_env_stat.stat.exists
  changed_when: false

- name: Create paperless env file from template
  ansible.builtin.template:
    src: "{{ dotfiles_dir }}/paperless-ngx/docker-compose.env.j2"
    dest: "{{ dotfiles_dir }}/paperless-ngx/docker-compose.env"
    mode: "0600"
  when: not paperless_env_stat.stat.exists
