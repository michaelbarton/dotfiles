---
- name: Create nvim virtual environment with uv
  ansible.builtin.command:
    cmd: uv venv {{ venv_path }}/nvim --python {{ python_version }}
    creates: "{{ venv_path }}/nvim/bin/python"

- name: Install nvim Python dependencies with uv
  ansible.builtin.command:
    cmd: >
      uv pip install --python {{ venv_path }}/nvim/bin/python
      codespell dap-python debugpy isort mdformat mdformat-frontmatter
      neovim pynvim "ruff==0.16.5" yamllint
  register: nvim_uv_pip
  changed_when: "'Installed' in nvim_uv_pip.stdout or 'Updated' in nvim_uv_pip.stdout"

- name: Stat nvim paths before symlinking
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/nvim/{{ item }}"
  loop:
    - ftplugin
    - dbt
  register: nvim_paths

- name: Remove existing directories that need to be replaced with symlinks
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/nvim/{{ item.item }}"
    state: absent
  loop: "{{ nvim_paths.results }}"
  when: item.stat.exists and item.stat.isdir and not item.stat.islnk

- name: Link specific configuration files
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
    state: link
  loop:
    - { src: "nvim/init.lua", dest: ".config/nvim/init.lua" }
    - { src: "nvim/lua", dest: ".config/nvim/lua" }
    - { src: "nvim/ftplugin", dest: ".config/nvim/ftplugin" }
    - { src: "dbt", dest: ".config/nvim/dbt" }

- name: Install jsonlint node.js package
  ansible.builtin.command:
    argv:
      - npm
      - install
      - --prefix
      - "{{ venv_path }}/nvim"
      - jsonlint
  args:
    creates: "{{ venv_path }}/nvim/node_modules/jsonlint"

- name: Restore Neovim plugins from lockfile
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - "+Lazy! restore"
      - "+qa"
  changed_when: false
  tags:
    - nvim

- name: Clean unused Lazy plugins
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - "+Lazy! clean"
      - "+qa"
  changed_when: false
  tags:
    - nvim

- name: Update treesitter parsers
  ansible.builtin.command:
    argv:
      - nvim
      - --headless
      - "+TSUpdateSync"
      - "+qa"
  changed_when: false
  tags:
    - nvim
