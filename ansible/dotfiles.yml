---
# Main Ansible playbook for managing dotfiles
# This playbook handles:
# - Creating necessary directories
# - Setting up Neovim configuration
# - Configuring OS-specific launch agents
# - Linking dotfiles to their proper locations
#
# To run only specific tags:
#   uv run ansible-playbook -i ~/.dotfiles/ansible/inventory.ini ~/.dotfiles/ansible/dotfiles.yml --tags "hooks,setup"
# Common tags: links, nvim, tmux, skills, hooks, setup, agents, paperless, paperless-backup, packages, macos

- name: Playbook to manage dotfiles
  hosts: localhost
  connection: local
  vars:
    venv_path: "{{ ansible_env.HOME }}/.venvs"
    python_version: "3.11" # Adjust this to your preferred Python version
    dotfiles_dir: "{{ ansible_env.HOME }}/.dotfiles"
    config_dir: "{{ ansible_user_dir }}/.config"
    # The one machine this repo treats as "home" — gates tasks that must
    # never run on a work computer (e.g. paperless auto-start).
    personal_hostname: Michaels-MacBook-Air

  tasks:
    - name: Create necessary directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "{{ config_dir }}/fish" }
        - { path: "{{ config_dir }}/nvim/autoload" }
        - { path: "{{ config_dir }}/plugged" }
        - { path: "{{ config_dir }}/ghostty" }
        - { path: "{{ config_dir }}/atuin" }
        - { path: "{{ config_dir }}/lazygit" }
        - { path: "{{ config_dir }}/ripgrep" }
        - { path: "{{ config_dir }}/uv" }
        - { path: "{{ config_dir }}/homebrew" }
        - { path: "{{ ansible_user_dir }}/cache" }
        - { path: "{{ ansible_user_dir }}/.bin" }
        - { path: "{{ ansible_user_dir }}/.hammerspoon" }
        - { path: "{{ ansible_user_dir }}/.ssh/sockets", mode: "0700" }
        - { path: "{{ ansible_user_dir }}/.local/share" }
        - { path: "{{ ansible_user_dir }}/.cache" }
        - { path: "{{ ansible_user_dir }}/.local/state" }
      tags:
        - always

    - name: Include Neovim setup tasks
      ansible.builtin.include_tasks: tasks/neovim.yml
      tags:
        - python
        - nvim

    - name: Include Homebrew package manifest tasks
      ansible.builtin.include_tasks: tasks/homebrew.yml
      tags:
        - packages
        - never

    - name: Include macOS defaults tasks
      ansible.builtin.include_tasks: tasks/osx_defaults.yml
      tags:
        - macos
        - never

    - name: Include tmux setup tasks
      ansible.builtin.include_tasks: tasks/tmux.yml
      tags:
        - tmux
        - setup

    - name: Include skills deployment tasks
      ansible.builtin.include_tasks: tasks/skills.yml
      tags:
        - skills
        - setup

    - name: Include agent hooks and Cursor rules deployment
      ansible.builtin.include_tasks:
        file: tasks/agent_hooks.yml
        apply:
          tags:
            - hooks
            - setup
      tags:
        - hooks
        - setup

    - name: Include paperless setup tasks
      ansible.builtin.include_tasks: tasks/paperless.yml
      tags:
        - paperless
        - never

    - name: Include paperless backup setup tasks
      ansible.builtin.include_tasks: tasks/paperless_backup.yml
      tags:
        - paperless-backup
        - never

    - name: Include bioinformatics Homebrew packages
      ansible.builtin.include_tasks: tasks/homebrew_bio.yml
      tags:
        - bio
        - never

    - name: Include dotfile linking tasks
      ansible.builtin.include_tasks: tasks/link_files.yml
      tags:
        - links
        - setup
